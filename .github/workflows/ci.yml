name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          GEMINI_API_KEY: "ci-placeholder"
          JWT_SECRET_KEY: "ci-placeholder-secret-key-for-testing-only"
          POSTGRES_HOST: localhost
          POSTGRES_DB: mechind_test
          POSTGRES_USER: mechind
          POSTGRES_PASSWORD: mechind_dev
        run: pytest tests/ -v --tb=short

  frontend-lint:
    name: Frontend Lint & Type Check (Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build (type check)
        working-directory: frontend
        run: npm run build
